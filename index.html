.backdrop:after{content:"";position:absolute;inset:0;background:#e8e8e826}
.grain{position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 3px,#00000008 3px 4px);opacity:.5}
main{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding-bottom:12svh;animation:page-in 1s .1s both}
.section-heading{margin:0 0 10px 18px;width:max-content;font:300 clamp(25px,3vw,42px)/1.15 "Segoe UI",sans-serif;letter-spacing:.045em;color:#e7ffff;text-shadow:0 0 5px #9bfff4,0 0 19px #2b9b9d}
.section-heading small{font:10px/1 "Segoe UI",sans-serif;letter-spacing:.28em;display:block;color:#e6eeebaa;text-shadow:none;margin-bottom:10px}
.band{width:100%;padding:10px var(--inset) 0 20px;background:linear-gradient(90deg,#03090996,#030909c9 38%,#020707bb);border-top:1px solid #ffffff10;border-bottom:1px solid #ffffff12}
.cards{display:flex;gap:var(--gap);justify-content:flex-end;margin:0 0 0 auto;width:var(--rail)}
.card{position:relative;display:block;flex:0 0 var(--card-width);height:calc(var(--card-width) * 1.34 + 58px);color:inherit;text-decoration:none;outline:none;isolation:isolate;animation:card-in .85s both;animation-delay:calc(.16s + var(--i) * .09s)}
.picture{position:absolute;inset:0 0 58px;overflow:hidden;border:1px solid #ffffff65;background:#1d2524;transition:border-color .3s,box-shadow .3s}
.picture img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .45s,transform .65s cubic-bezier(.2,.7,.2,1);filter:brightness(.94)}
.card[data-key="matter"] img{object-position:50% 50%}
.card[data-key="bath"] img{object-position:50% 50%}
.card[data-key="robot"] img{object-position:50% 50%;transform-origin:50% 50%}
.card[data-key="kakutora"] img{object-position:50% 50%}
.picture:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#0218189e,transparent 60%);opacity:0;transition:opacity .4s}
.card.is-active .picture{border-color:var(--cyan);box-shadow:0 0 0 1px #aaffee40,0 0 20px #4fffd512}
.card.is-active img{filter:brightness(.73)}
.card.is-active .picture:after{opacity:0}
.card:focus-visible .picture{outline:2px solid var(--cyan);outline-offset:4px}
.card-title{position:absolute;left:12px;right:8px;bottom:0;height:58px;display:flex;align-items:center;align-content:center;flex-wrap:wrap;column-gap:5px;row-gap:0;margin:0;font-size:16px;font-weight:700;line-height:1.4;white-space:normal;opacity:0;transform:translateY(4px);transition:opacity .3s,transform .4s}
.card-title span{font:inherit;color:inherit}
.card-title span:after{content:none}
.card[data-key="kakutora"] .card-title span{flex-basis:100%}
.card.is-active .card-title{opacity:1;transform:translateY(0)}
.caption-space{height:0;width:var(--rail);margin-left:auto;position:relative}
.arrow-band{width:100%;overflow-x:clip;overflow-y:visible;margin-top:22px;background:#020707d9}
.track{position:relative;margin:0 var(--inset) 0 auto;width:var(--rail);height:36px}
.track:before{content:"";position:absolute;left:clamp(0px,var(--marker,0px),calc(var(--rail) - var(--card-width)));top:-80px;width:1px;height:96px;background:var(--cyan);transition:left .5s cubic-bezier(.22,.8,.22,1)}
.indicator{position:absolute;left:0;top:8px;height:16px;width:min(140px,var(--card-width));transition:transform .5s cubic-bezier(.22,.8,.22,1);filter:drop-shadow(0 0 5px #00e7d14d);transform:translateX(clamp(0px,var(--marker,0px),calc(var(--rail) - var(--card-width))))}
.indicator:before{content:"";position:absolute;width:40px;height:16px;background:var(--cyan);clip-path:polygon(0 0,100% 0,77% 100%,0 100%)}
.indicator:after{content:"";position:absolute;left:35px;width:calc(100% - 35px);height:16px;transform:skewX(-30deg);background:repeating-linear-gradient(90deg,var(--cyan) 0 2px,transparent 2px 4px);mask-image:linear-gradient(90deg,#000,transparent)}
@keyframes background-in{from{opacity:0}to{opacity:1}}
@keyframes page-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes card-in{from{opacity:0;translate:0 15px}to{opacity:1;translate:0 0}}
@media(min-width:1700px){:root{--card-width:224px;--gap:8px;--inset:5vw}}
@media(max-width:760px){:root{--card-width:clamp(130px,27vw,190px);--gap:8px;--inset:18px;--rail:calc(2 * var(--card-width) + var(--gap))}main{padding:40px 0 12svh;min-height:100svh}.section-heading{font-size:30px}.cards{display:grid;grid-template-columns:repeat(2,var(--card-width));row-gap:12px}.card{height:calc(var(--card-width)*1.25 + 58px)}.picture{bottom:58px}.card-title{height:58px;display:flex;white-space:normal;font-size:13px;padding-top:3px;line-height:1.35}.card-title span{display:block;font-size:12px;width:100%}.card-title span:after{content:none}.band{padding-top:10px}.caption-space{height:0}.arrow-band{margin-top:20px}.indicator{width:120px}.indicator:before{width:34px}.indicator:after{left:29px;width:91px}.track:before{height:94px;top:-78px}}
@media(max-height:520px) and (min-width:761px){:root{--card-width:clamp(140px,22vh,180px)}main{padding:24px 0 5vh}.section-heading{font-size:25px}.arrow-band{margin-top:15px}.track:before{top:-73px;height:89px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* Drawn mint ornament and mechanical tracery; no decorative bitmap assets. */
:root{--cyan:#53f6e1;--metal:#53f6e1;--engraving:#64a99f}
.backdrop:after{background:linear-gradient(90deg,#13141c38,#18182118)}
.section-heading{font-family:Georgia,"Times New Roman",serif;letter-spacing:.12em;color:#e7ffff;text-shadow:0 1px 2px #0009,0 0 14px #53f6e135}
.band{background:linear-gradient(90deg,#131314ac,#0b1013dc 45%,#0a1012d4);border-color:#53f6e122}
.picture{border-color:#a5d0c855}
.card.is-active{z-index:3}
.card.is-active img{filter:brightness(.49) saturate(.8)}
.card.is-active .picture{clip-path:polygon(.45% 8%,.45% 3.33%,4.46% .33%,20.09% .33%,23.21% 2.33%,86.61% 2.33%,91.07% .33%,95.09% .33%,99.55% 3.67%,99.55% 90.33%,94.64% 94%,94.64% 97.33%,91.07% 99.67%,14.73% 99.67%,12.05% 98%,.45% 98%);border-color:transparent;box-shadow:0 0 18px #53f6e118}
.card:not(.is-active) .card-title{visibility:hidden;width:calc(var(--card-width) - 20px);max-width:calc(var(--card-width) - 20px);overflow:hidden}
.card-title{width:max-content;max-width:var(--title-room,calc(100vw - 40px));right:auto;flex-wrap:nowrap;gap:8px;color:#edf8f5;text-shadow:0 1px 4px #000}
.card[data-key="kakutora"] .card-title{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:0}
.card[data-key="kakutora"] .card-title span{flex-basis:auto}
.selection-frame{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .28s;pointer-events:none;overflow:visible}
.card.is-active .selection-frame{opacity:1}
.selection-frame path{vector-effect:non-scaling-stroke}
.frame-shadow{fill:none;stroke:#080c10;stroke-width:7}
.frame-outline{fill:none;stroke:var(--metal);stroke-width:1.3}
.frame-inner{fill:none;stroke:var(--metal);stroke-width:.75;opacity:.5}
.frame-plate{fill:var(--metal)}
.frame-ticks{fill:var(--metal);stroke:none}
.frame-scroll{fill:none;stroke:var(--metal);stroke-width:1;opacity:.9}
.indicator{filter:drop-shadow(0 0 4px #53f6e138)}

<style id="home-polish-style">
/* ==========================================================
   ZeonMacha Home — UI/UX Polish Layer
   Loaded after glitch-demo.css; overrides only what it touches.
   Goals (ui-ux-pro-max checklist):
   - accessible contrast (muted text >= 4.5:1 on dark bg)
   - visible focus ring, 44px touch targets
   - layered depth: static borders, glow reserved for active state
   - yui-css-animations motion: spatial continuity, slower-in/faster-out,
     staggered settle, reduced-motion fallbacks
   ========================================================== */

:root{
  /* Refactoring-UI style palette: two weights of cyan, not ten */
  --cyan-hi:#b4fff1;          /* near-white mint: focus, active text */
  --cyan:#53f6e1;             /* brand accent: indicator, frames */
  --cyan-dim:#53f6e159;       /* borders at rest */
  --cyan-glow:#53f6e114;      /* ambient glow, barely there */
  --ink:#e7eeee;              /* primary text */
  --ink-dim:#a9c0ba;          /* secondary text — bumped from #b6cbc5-on-dark for AA */
  --surface-1:#0b1013d9;      /* band */
  --surface-2:#06080899;      /* deeper panel */
}

/* ---------- Depth & atmosphere ------------------------------ */
/* Vignette keeps the corners dark so the band reads as the focal layer.
   Pure CSS, zero image cost, sits above the blurred backdrop. */
.grain:after{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 42%,transparent 55%,#00000052 100%);
}

/* ---------- Header hierarchy -------------------------------- */
/* Restraint: kill the heavy glow, keep one crisp shadow + faint halo. */
.home-intro .section-heading{
  color:#f2faf8;
  text-shadow:0 1px 2px #000a,0 0 22px #53f6e12b;
}
.home-subtitle{color:var(--ink-dim)}

/* Icon buttons: 44px hit area (AA touch), visible 30px glyph. */
.home-links{gap:2px}
.home-link{
  width:44px;height:44px;opacity:.72;border-radius:6px;
  transition:opacity .18s ease,background-color .18s ease;
}
@media(hover:hover){.home-link:hover{background:#53f6e114}}
.home-link:focus-visible{outline:2px solid var(--cyan-hi);outline-offset:-2px;opacity:1}
@media(max-width:760px){.home-link{width:44px;height:44px}}

/* ---------- Cards -------------------------------------------- */
/* Rest state: quieter border, slight lift-off via shadow instead of glow. */
.card:not(.is-active) .picture{
  border-color:#a5d0c838;
  box-shadow:0 2px 10px #00000045;
  transition:border-color .25s ease,box-shadow .25s ease;
}
/* Hover affordance (mouse only): image lifts, border warms — feedback
   before the click, without committing the active frame. */
@media(hover:hover){
  .card:not(.is-active):hover .picture{border-color:#a5d0c873;box-shadow:0 4px 16px #0000005c}
  .card:not(.is-active):hover img{filter:brightness(.68) saturate(.9)}
}

/* Active state: the SVG frame carries identity; add a controlled halo
   outside it rather than stacking box-shadows on the clipped picture. */
.card.is-active{filter:drop-shadow(0 0 14px var(--cyan-glow))}

/* Title legibility: stronger hierarchy between main label and meta line. */
.card .card-title{text-shadow:0 1px 6px #000c,0 1px 2px #000}
.card .card-title span{color:#cfe2dc;letter-spacing:.04em}
.card.is-active .card-title{color:#f4fffc}
.card.is-active .card-title span{color:var(--ink-dim)}

/* Focus: single unmistakable ring; never rely on the frame alone. */
.card:focus-visible{outline:2px solid var(--cyan-hi);outline-offset:4px;border-radius:2px}
.card:focus-visible .card-title{color:var(--cyan-hi)}

/* ---------- Indicator & track -------------------------------- */
/* The arrow should feel attached to the card: sharpen its glow, and give
   the connector line a soft cap fade instead of a hard cut. */
.indicator{filter:drop-shadow(0 0 6px #00e7d166)}
.track:before{
  background:linear-gradient(var(--cyan),#53f6e100);
  width:1.5px;
}

/* ---------- Motion (yui-css-animations principles) ------------ */
/* 1. Spatial continuity: entrance moves cards along the axis they arrived
      from, and exits are faster than entrances. */
.card{transition:filter .18s ease}
.card .card-title{
  transition:opacity .22s ease .05s,transform .3s cubic-bezier(.2,.7,.2,1) .05s;
}
/* 2. Settle, don't snap: selection-frame fades in slightly after the
      picture brightens, so the eye reads image first, chrome second. */
.selection-frame{transition:opacity .3s ease .08s}
/* 3. Indicator travel: spring-ish curve, but quick — it's feedback, not
      a scene. */
.indicator{transition:transform .42s cubic-bezier(.3,1.1,.3,1)}

      the rail (home-rail-deploy) at handover. Adding one would double-

/* ---------- Edge bars: hierarchy -------------------------------
   The bars share the selection frame's exact cyan (locked by the

.page-edge svg{

/* Terminus ticks: two vertical 1px marks cap the long runs, matching

.edge-tick{

/* Traveling glow segment on the wires: removed. The lit dash read as

/* ---------- Card frame: geometry refinement ---------------------
   The SVG paths in the HTML were redrawn: corner engraving lines now
   STEP their endpoints (36/33/30, 188/191/194) so the three lines

.card .frame-ticks{opacity:.85}          /* ticks read as engraved, not lit */

/* ---------- Edge bars: tone fix --------------------------------
   Regression analysis: the original structure is .page-edge (clear)

   the gradient on .page-edge itself — an unclipped rectangle behind

   Correct fix: restore the clipped ::before exactly, only re-hued.
   The stock gradient (#e0f0eb26 → #c6e1db16) reads as grey haze and
   floats off the dark page; we keep its clip and position but shift
   it darker and toward the line's own mint, so the shallow backing
   hugs the linework and melts into the page. Outside the bars, the
   thin scrim on .grain:after still darkens the viewport edges. */
.page-edge{background:none;box-shadow:none}
.page-edge::before{
  display:block;
  background:linear-gradient(#9fd8ce1f,#6faea422);
}
/* Scrim: a fixed 34px-deep darkening band at each viewport edge, placed
   UNDER .page-edge (z-index 5 vs 4), fading out before it can reach
   the band. Outside the rails the page keeps its normal backdrop. */
.grain:after{
  background:
    radial-gradient(120% 90% at 50% 42%,transparent 55%,#00000052 100%),
    linear-gradient(#03070aa8,#03070a00 34px),
    linear-gradient(0deg,#03070aa8,#03070a00 34px);
}

/* ---------- Edge bars: entrance --------------------------------
   Plays at html.signal-settled (the glitch handover), never beneath
   the overlay. The whole rail — lines, plates, hatching — is ONE
   machined part, so it enters as ONE piece: both bars slide in from
   above/below and converge on the scene. No staged flicker, no
   per-path animation: splitting a single rail into acts just reads
   as a render glitch. */
html.signal-settled .edge-top{
  animation:edge-converge-top .65s cubic-bezier(.22,.9,.24,1) .05s backwards;
}
html.signal-settled .edge-bottom{
  animation:edge-converge-bottom .65s cubic-bezier(.22,.9,.24,1) .05s backwards;
}
@keyframes edge-converge-top{
  from{opacity:0;transform:translateY(-100%)}
  to{opacity:1;transform:translateY(0)}
}
@keyframes edge-converge-bottom{
  from{opacity:0;transform:rotate(180deg) translateY(-100%)}
  to{opacity:1;transform:rotate(180deg) translateY(0)}
}

/* ---------- Page choreography ---------------------------------
   Order: glitch intro → (signal-settled) edges sweep open & surface
   breathes → rail deploys → cards feed → copy rises → hardware on.
   The JS drives rail/cards/copy from the same handover, so the whole
   page now plays as one continuous power-on sequence. */

/* ---------- Retro-Futurism layer --------------------------------
   Borrowed, not adopted: the CRT register (scanline texture + slow
   phosphor drift on the backdrop) adds the "aged machine" warmth that
   pure FUI lacks, without the neon-pink palette or arcade glow. */

/* Interlaced scanlines over the whole frame — finer and dimmer than
   the existing grain, so the two textures moiré into a screen feel. */
.grain:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent 0 2px,#00000014 2px 3px);
  mix-blend-mode:multiply;
}
/* A single CRT "degauss" blink as the frame hands over — one-shot,
   opacity only (cheap), on the viewport wrapper so it fights nothing.
   The machine doesn't fade in; it snaps on, blinks twice, settles. */
html.signal-settled .main-viewport{
  animation:crt-settle .4s steps(2,jump-none);
}
@keyframes crt-settle{
  0%{opacity:.55} 45%{opacity:1} 60%{opacity:.8} 100%{opacity:1}
}

/* Reduced motion: bars already converged; no degauss. */
@media(prefers-reduced-motion:reduce){
  html.signal-settled .edge-top,html.signal-settled .edge-bottom{animation:none!important}
  html.signal-settled .main-viewport{animation:none!important}
}

/* ==========================================================
   v3 — idle presence & selection effects
   Style basis: HUD/FUI. All motion is transform/opacity only,
   gated on .signal-settled, and collapses under reduced-motion.
   ========================================================== */

/* ---------- 1. Idle presence ("the machine is watching") --------
   Nothing loops forever at full brightness — the page BREATHES. */

/* A very slow scan sweep crosses the band every 14s. It is a 1px
   mint hairline with a soft tail, traveling the rail like a radar
   trace. Implemented as a band ::after so it clips to the rail. */
.band{position:relative;overflow:hidden}
.band::after{
  content:"";position:absolute;top:0;bottom:0;left:0;width:120px;
  pointer-events:none;opacity:0;
  background:linear-gradient(90deg,transparent,#53f6e114 55%,#53f6e12e 92%,#b4fff166 99%,transparent);
  transform:translateX(-140px);
}
html.signal-settled .band::after{animation:band-scan 14s linear 6s infinite}
@keyframes band-scan{
  0%{opacity:0;transform:translateX(-140px)}
  3%{opacity:1}
  14%{opacity:1;transform:translateX(calc(100vw + 40px))}
  15%{opacity:0;transform:translateX(calc(100vw + 40px))}
  100%{opacity:0;transform:translateX(calc(100vw + 40px))}
}

/* The indicator block breathes: opacity swell on the arrow itself,
   deep enough to read at a glance (per request, more visible). */
html.signal-settled .indicator{animation:indicator-breathe 4s ease-in-out 3.5s infinite}
@keyframes indicator-breathe{0%,100%{opacity:.5}50%{opacity:1}}

/* Removed: scan-glitch on card images. The interference frames fought
   the artwork and the :has() free channels; the sweep alone carries
   the patrol reading. */

/* The indicator keeps its single static glow. No idle pulse, no
   data packet — those read as decoration, not instrumentation. */

/* ---------- 2. Selection effects ---------------------------------
   The frame already appears; what was missing is that the selection
   should feel ACQUIRED, like a target lock, not just shown. */

/* a) Removed: the picture-veil snap. The active card keeps its own
   hover/focus feedback from the base layer; no extra dimming. */

/* b) Corner brackets: the selection-frame SVG already draws the
   outline; we add a short draw-on of the outer frame so each new
   selection is visibly ACQUIRED (stroke draw, 220ms, non-looping). */
.card.is-active .frame-outline{
  stroke-dasharray:1400;stroke-dashoffset:1400;
  animation:frame-acquire .22s cubic-bezier(.3,0,.2,1) forwards;
}
@keyframes frame-acquire{to{stroke-dashoffset:0}}
/* The inner trace follows 60ms later and faster — hardware first,
   engraving second. */
.card.is-active .frame-inner{
  stroke-dasharray:900;stroke-dashoffset:900;
  animation:frame-acquire .18s cubic-bezier(.3,0,.2,1) .06s forwards;
}

/* c) The active card's SECOND line (the meta span) gets a breathing
   cursor block at its end — the readout is LIVE. It rides inline
   after the last character of that row, not the title block. */
.card.is-active .card-title span:last-child::after{
  content:"";display:inline-block;width:6px;height:.85em;
  margin-left:5px;vertical-align:-.08em;
  background:var(--cyan);
  animation:readout-cursor 1.1s steps(1) infinite;
}
@keyframes readout-cursor{0%,55%{opacity:1}56%,100%{opacity:0}}

/* d) Removed: the "standby dimming" of non-active cards. Muting three
   quarters of the rail punished exploration; every card stays equally
   readable whether or not one is selected. */

/* ---------- Idle & selection reduced-motion -------------------- */
@media(prefers-reduced-motion:reduce){
  html.signal-settled .band::after,
  html.signal-settled .indicator{animation:none!important}
  .card.is-active .frame-outline,.card.is-active .frame-inner{animation:none!important;stroke-dasharray:none;stroke-dashoffset:0}
  .card.is-active .card-title span:last-child::after{animation:none!important;opacity:1}
}

/* ---------- FUI checklist refinements --------------------------
   From the HUD/FUI implementation checklist: 1px fine-line language,
   monospaced tech type for readouts, markers over filled panels. */

/* Card titles keep their original tone: the meta line is NOT forced
   into mono/uppercase — the FUI readout styling stays only on the
   home-subtitle where it belongs. The active card's meta line gets a
   breathing cursor block at its end instead. */

/* Resting picture borders step down to the 1px hairline register —
   the glow belongs to the selected frame only. */
.card:not(.is-active) .picture{border-color:#a5d0c833}

/* The vertical connector reads as a scan line, not a bar: 1px,
   fades at both ends like a signal trace. */
.track:before{
  width:1px;
  background:linear-gradient(#53f6e100,var(--cyan) 30%,var(--cyan) 70%,#53f6e100);
}

/* While the glitch intro owns the screen, .glitch-pending already keeps
   .page-edge visibility:hidden; every entrance above is armed on
   .signal-settled, so nothing plays unseen beneath the overlay. */

</style>

  function drawSignalWords(ms, quiet) {

      [460, 900, .05, .79, '同期信号を検出', 'SYNC SEARCH / 59.94'],
      [880, 1320, .57, .85, '映像信号・復元中', 'FRAME BUFFER / REBUILD'],
      [1290, 1710, .04, .22, '信号同期', 'CARRIER LOCKED'],
      [1600, 1860, .55, .77, '映像信号・復元中', 'ANALOG / DIGITAL']

  function drawArchiveTexture(ms, quiet) {

  function render(ms) {

  }
  let homeRoll = null;

  let entranceTimer = 0;
  let lastEntranceCard = null;
  function finishEntrance(immediate = false) {

  // Encode a single reusable displacement texture, never a new PNG per frame.

    void main.offsetWidth;
    animated.forEach(el => { el.style.removeProperty('animation-name'); });

    if (document.hidden) settle();

  window.addEventListener('pagehide', settle);
  window.addEventListener('pageshow', event => { if (event.persisted) settle(); });
  window.addEventListener('resize', () => {
    // A resized surface (rotation / mobile toolbar) must not restart or stretch a paused frame.
    if (running || root.classList.contains('home-entering')) settle();
  });

  try {
    const from = new URL(document.referrer);
    sameSiteReturn = from.origin === location.origin && from.pathname !== location.pathname;
  } catch (_) { /* A direct visit has no referrer. */ }

    play();

  } catch (error) {
