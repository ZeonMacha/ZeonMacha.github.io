<!doctype html>
<html lang="zh-CN" data-script="mars">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title data-ui="page-title">PROFILE</title>
<!--
  ============================================================
  个人档案页（PROFILE）
  ------------------------------------------------------------
  · 改文字内容 → profile-assets/content.js（唯一内容来源）
  · 改界面文案 → 本文件里 data-text 属性 / 「UI 文案」表
  · 改样式     → profile-assets/style.css
  · 改交互     → profile-assets/app.js（启动检测在 boot.js）
  本地直接双击打开也能用；发布用同目录的 一键发布.cmd。
  ============================================================
-->
<link rel="stylesheet" href="./profile-assets/style.css">
<link rel="preload" href="./profile-assets/huiwen-mincho.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./profile-assets/huiwen-symbols.woff2" as="font" type="font/woff2" crossorigin>
</head>
<body>

<!-- ===================== 页面骨架 ===================== -->
<main class="workspace" aria-label="存档档案" data-ui-aria="aria-workspace">
  <div class="outside">
    <span data-ui="outside-file">PROFILE / 001</span>
    <span data-ui="outside-mode">TEXT MODE : UTF-8</span>
  </div>

  <article class="window">
    <!-- ---------- 标题栏 ---------- -->
    <header class="heading">
      <i class="cross" aria-hidden="true"></i>
      <div class="heading-copy">
        <div class="eyebrow" data-ui="heading-eyebrow">P E R S O N A L / F I L E</div>
        <h1 id="profile-title">[标题]</h1>
      </div>
      <i class="cross" aria-hidden="true"></i>
    </header>

    <!-- ---------- 工具栏：语言（字符模式）切换 ---------- -->
    <nav class="toolbar" aria-label="显示设置" data-ui-aria="aria-toolbar">
      <span class="path" data-ui="toolbar-path">C:\PROFILE&gt;</span>
      <!-- 有下划线的那个就是当前模式，点击可切换 -->
      <button id="language" type="button" aria-label="当前焱暒妏，点击切换到地球文">[ <span data-ui="script-mars" class="selected-script">焱暒妏</span> / <span data-ui="script-earth">地球文</span> ]</button>
    </nav>

    <!-- ---------- 主体：左身份栏 + 右终端 ---------- -->
    <div class="columns">
      <aside class="identity panel" aria-label="个人信息" data-ui-aria="aria-identity">
        <h2 class="panel-title"><span data-ui="panel-identity">01 / WHOAMI</span></h2>
        <div class="identity-body">
          <figure class="portrait">
            <!-- 用户提供的 ASCII 导出代码，原图与渲染器均包含在本地文件中。 -->
            <iframe src="./profile-assets/portrait-effect.html" title="ASCII 字符头像" data-ui-title="aria-portrait" tabindex="-1" sandbox="allow-scripts"></iframe>
          </figure>
          <div class="identity-info">
            <h2 class="name" id="profile-name">[名字]</h2>
            <p class="handle" id="profile-id">[ID]</p>
            <p class="bio" id="profile-bio">[个人简介]</p>
            <nav class="identity-links" aria-label="个人网站">
              <a href="https://zeonmacha.github.io/" target="_blank" rel="noopener noreferrer">[GITHUB]</a>
              <a href="https://zeonmacha.blog.fc2.com/" target="_blank" rel="noopener noreferrer">[FC2]</a>
            </nav>
            <div class="identity-foot">
              <div class="ascii-player" id="ascii-player" role="group" aria-label="音乐播放器" data-state="off">
                <div class="ascii-spectrum" id="ascii-spectrum" aria-hidden="true"></div>
                <label class="music-volume" title="音量：点击或拖动；最左侧静音">
                  <span class="volume-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
                  <input id="music-volume" type="range" min="0" max="6" step="1" value="4" aria-label="音乐音量，六档" aria-valuetext="音量 4 / 6 档">
                </label>
                <audio id="profile-music" src="./profile-assets/mizunishizumupiano.mp3" preload="none" loop></audio>
                <span id="music-status" class="sr-only" role="status" aria-live="polite"></span>
              </div>
              <i class="cross small" aria-hidden="true"></i>
            </div>
          </div>
        </div>
      </aside>

      <section class="terminal panel" aria-label="命令终端" data-ui-aria="aria-terminal">
        <h2 class="panel-title">
          <span data-ui="panel-terminal">02 / TERMINAL</span>
          <button type="button" id="skip" disabled aria-label="立即显示全部文字" data-ui="skip-label" data-ui-aria="aria-skip">[ skip ]</button>
        </h2>
        <div class="terminal-body" id="terminal-output" tabindex="0" aria-label="命令输出记录" data-ui-aria="aria-output">
          <noscript data-ui="noscript-copy">请启用 JavaScript 使用终端。<br>ENABLE JAVASCRIPT TO USE THIS TERMINAL.</noscript>
        </div>
        <div class="reply">
          <div id="command-menu" class="command-menu" hidden>
            <div class="menu-label" data-ui="menu-heading">COMMANDS / ↑ ↓ ENTER</div>
            <div id="command-options" role="listbox" aria-label="选择命令" data-ui-aria="aria-options"></div>
            <div class="menu-empty" id="menu-empty" data-ui="menu-empty" hidden>[ no match ]</div>
          </div>
          <form class="commandline" id="command-form" autocomplete="off">
            <label class="prompt" for="command" data-ui="input-prompt">&gt;_</label>
            <!-- 回车符号：字体里没有 U+21B5，用内联 SVG 保证任何设备显示一致 -->
            <input id="command" role="combobox" aria-label="输入或选择命令" data-ui-aria="aria-command" aria-controls="command-options" aria-expanded="false" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="[ COMMAND ]" data-ui-placeholder="command-placeholder">
            <textarea id="contact-message-input" rows="2" aria-label="请输入内容" spellcheck="false" hidden></textarea>
            <input id="contact-trap" class="contact-trap" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
            <button id="menu-toggle" type="button" aria-label="展开命令菜单" aria-expanded="false" aria-controls="command-menu" data-ui="menu-toggle-symbol">^</button>
            <button type="submit" aria-label="执行命令" data-ui-aria="aria-submit">
              <svg class="ui-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true" focusable="false">
                <path d="M13.2 3.6v5.9a2 2 0 0 1-2 2H3.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
                <path d="M6.1 8.5 3 11.5l3.1 3" fill="none" stroke="currentColor" stroke-width="1.7"/>
              </svg>
            </button>
          </form>
        </div>
      </section>
    </div>

    <footer class="status">
      <span id="status">[ READY ]</span>
      <span data-ui="footer-shortcuts">ESC : CLOSE / ENTER : RUN</span>
    </footer>
    <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  </article>

  <div class="below">
    <a href="index2.html" data-ui="home-link">&lt; 切換主題</a>
    <span data-ui="footer-file">INDEX.HTML</span>
  </div>
</main>
