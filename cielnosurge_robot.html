function snapshot(){history.push(JSON.stringify(state));if(history.length>40)history.shift();$('undo').disabled=false;}
function parseQuantity(value,max=MAX){const s=value.trim();if(!/^\d+(\s*\+\s*\d+)*$/.test(s))return null;const n=s.split('+').reduce((a,b)=>a+Number(b.trim()),0);return Number.isSafeInteger(n)&&n<=max?n:null;}

// Parent-first topological order ensures shared ingredients are aggregated before stock is deducted.
function orderGraph(){const indegree=Object.fromEntries(ALL.map(x=>[x.id,0]));for(const item of DATA.items)for(const id of Object.keys(item.ingredients)){if(!BY_ID[id])throw Error('未知配方材料');indegree[id]++;}const queue=ALL.filter(x=>!indegree[x.id]).map(x=>x.id),order=[];while(queue.length){const id=queue.shift();order.push(id);for(const child of Object.keys(BY_ID[id].ingredients||{}))if(--indegree[child]===0)queue.push(child);}if(order.length!==ALL.length)throw Error('配方存在循环');return order;}

function craftRow(item){const n=result.missing[item.id],isOpen=opened.has(item.id);return `<tr class="${item.id==='71'?'total-row':''}" id="item-${item.id}"><td><button class="item-name" data-recipe="${item.id}" aria-expanded="${isOpen}" aria-controls="recipe-${item.id}">${esc(item.name)}</button><span class="alias"><span class="category-tag">${esc(item.category)}</span>${esc(item.alias)}</span></td><td data-label="需求" class="num">${result.need[item.id]}</td><td data-label="库存">${stepper(item)}</td><td data-label="尚缺" class="num ${n?'need':'zero'}">${n||'—'}</td><td data-label="工时" class="num">${n?time(n*minutes(item,state.version)):'—'}</td></tr><tr class="recipe-row" id="recipe-${item.id}" ${isOpen?'':'hidden'}><td colspan="5">${recipeBody(item)}</td></tr>`;}
// One shared column grid for every table, so 需求 / 当前库存 / 尚缺 line up across the whole page.
const COLS='<colgroup><col class="recipe-col"><col class="num-col"><col class="stock-col"><col class="num-col"><col class="time-col"></colgroup>';
function craftTable(items,group='assembly'){items=sorted(items,group);return items.length?`<table>${COLS}<thead><tr>${sortHead("材料名 / 未知名称","name",group)}${sortHead("需求","need",group)}${sortHead("当前库存","stock",group)}${sortHead("尚缺","missing",group)}${sortHead("剩余工时","time",group)}</tr></thead><tbody>${items.map(craftRow).join('')}</tbody></table>`:'<div class="empty">没有符合条件的工作素材。</div>';}
const normalize=s=>s.normalize('NFKC').toLowerCase();
function render(){
  const active=document.activeElement,control=active?.closest('.stepper')?.dataset.control;
  const focusKind=active?.matches('input')?'input':active?.dataset.step;
  const scrolls=[...document.querySelectorAll('.table-wrap')].map(el=>[el.id,el.scrollLeft]);
  result=calculate(state);$('target').value=state.target;$('version').value=state.version;$('auto-consume').checked=autoOn();
  const baseline=calculate({...state,stock:{}}).time,pct=baseline?Math.round((1-result.time/baseline)*100):100;
  $('progress').value=pct;$('progress-text').textContent=pct+'%';$('time').textContent=time(result.time);
  const pending=DATA.items.filter(x=>result.missing[x.id]>0),gather=DATA.raw.filter(x=>result.missing[x.id]>0);
  $('craft-count').textContent=pending.reduce((a,x)=>a+result.missing[x.id],0)+' 件';
  $('raw-count').textContent=gather.reduce((a,x)=>a+result.missing[x.id],0)+' 个';
  $('assembly-list').innerHTML=craftTable(['71','67','68','69','70'].map(id=>BY_ID[id]));
  const q=normalize($('search').value.trim()),category=$('category').value;
  const items=DATA.items.filter(x=>Number(x.id)<67&&(!q||normalize(x.name+' '+x.alias).includes(q))&&(!category||x.category===category)&&(!$('only-missing').checked||result.missing[x.id]>0));
  $('craft-list').innerHTML=craftTable(items,'craft');$('craft-visible').textContent=items.length+' / 62 项';
  const rq=normalize($('raw-search').value.trim());const raw=sorted(DATA.raw.filter(x=>(!$('location').value||x.location===$('location').value)&&(!rq||normalize(x.name+' '+(x.location||'')).includes(rq))&&(!$('raw-missing').checked||result.missing[x.id]>0)),'raw');

const autoOn=()=>state.auto!==false;
// Crafting must consume its ingredients, otherwise a finished item and its parts are counted twice.
// takeOne() spends one unit of a material, falling back to that material's own recipe when the shelf is empty.
function takeOne(id,taken,short){
  if(stock(id)>0){state.stock[id]=stock(id)-1;taken.set(id,(taken.get(id)||0)+1);return true;}
  const sub=BY_ID[id].ingredients;
  if(!sub){short.n++;return false;}
  let ok=true;
  for(const [child,count] of Object.entries(sub))for(let i=0;i<count;i++)if(!takeOne(child,taken,short))ok=false;
  return ok;
}
function refundIngredients(item,back){
  for(const [child,count] of Object.entries(item.ingredients||{})){state.stock[child]=Math.min(MAX,stock(child)+count);back.set(child,(back.get(child)||0)+count);}
}
function brief(map){const all=[...map].map(([id,n])=>`${BY_ID[id].name}×${n}`);return all.length>4?`${all.slice(0,4).join('、')} 等 ${all.length} 项`:all.join('、');}

function updateStock(id,n){

    if(delta>0){

      if(item.ingredients&&autoOn())for(const [child,count] of Object.entries(item.ingredients))for(let i=0;i<count;i++)takeOne(child,taken,short);
    }else{
      if(stock(id)<=0)break;
      state.stock[id]=stock(id)-1;
      if(item.ingredients&&autoOn())refundIngredients(item,back);
    }
  }

  else if(delta>0)toast(taken.size?`已合成 ${item.name} ×${qty}：扣除 ${brief(taken)}${gap}${rest}`:`已记录 ${item.name} ×${qty}；前置材料均未入库，库存未变动${rest}`);
  else toast(back.size?`已拆解 ${item.name} ×${qty}：返还 ${brief(back)}${rest}`:`已记录 ${item.name} ×${qty}${rest}`);
}
function commitInput(input){const id=input.dataset.stock,isTarget=input.id==='target';const n=parseQuantity(input.value,isTarget?99:MAX);if(n===null||(isTarget&&n<1)){input.value=isTarget?state.target:stock(id);input.setAttribute('aria-invalid','true');toast(isTarget?'目标请输入 1～99 的整数':'请输入非负整数或加法，例如 2+3+5');return;}input.removeAttribute('aria-invalid');if(isTarget){if(n!==state.target){snapshot();state.target=n;save();render();}else input.value=n;}else if(n!==stock(id))updateStock(id,n);else input.value=n;}

$('export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'ciel-es45-v1',...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ciel-es45-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('进度文件已导出');};
$('import').onclick=()=>$('import-file').click();
$('import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>100000)throw Error('进度文件过大');const parsed=JSON.parse(await file.text());if(parsed.format!=='ciel-es45-v1')throw Error('不是本页导出的进度文件');const next=validState(parsed);if(!confirm('导入将替换当前库存、目标数量和时间口径，是否继续？'))return;snapshot();state=next;save();render();toast('已导入进度');}catch(error){toast(error.message||'无法读取进度文件');}finally{e.target.value='';}};
$('copy-list').onclick=async()=>{const rows=DATA.raw.filter(x=>result.missing[x.id]>0);const text=rows.length?rows.map(x=>`${x.name} × ${result.missing[x.id]}${x.location?' / '+x.location:''}`).join('\n'):'采集素材已备齐';try{await navigator.clipboard.writeText(text);toast('已复制全部尚缺采集素材');}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'已复制采集清单':'复制失败，请手动选择表格内容');}};
function syncNav(){const sections=[...document.querySelectorAll('main section')];let current=sections[0];for(const section of sections)if(section.getBoundingClientRect().top<=150)current=section;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')===(current.id==='plan'?'#top':'#'+current.id)));}
window.addEventListener('scroll',syncNav,{passive:true});window.addEventListener('resize',syncNav);syncNav();
render();
</script></body></html>
