const DATA=JSON.parse(document.getElementById('recipe-data').textContent);
const ICONS=JSON.parse(document.getElementById('icon-data')?.textContent||'{}');
const ALL=[...DATA.items,...DATA.raw], BY_ID=Object.fromEntries(ALL.map(x=>[x.id,x]));
function iconImg(item){const src=ICONS[item.id];return src?`<img class="item-icon" src="${src}" alt="" width="45" height="45">`:'';}
const KEY='ciel-es45-planner-v1', MAX=999999;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let state=fresh(),history=[],opened=new Set(),result,toastTimer;
const branches=new Set(),minimized=new Set();

function recipeBody(item,path=item.id){
  const parts=Object.entries(item.ingredients);
  const cards=parts.map(([id,n])=>{const child=BY_ID[id],key=path+'-'+id,craft=!!child.ingredients;
    const label=`${esc(child.name)} × ${n}`;
    return `<div class="ingredient"><div class="ingredient-head">${iconImg(child)}<div class="ingredient-text">${craft?`<button class="ingredient-toggle" data-branch="${key}" aria-expanded="${branches.has(key)}" aria-controls="branch-${key}">${label}<span class="branch-arrow" aria-hidden="true">${branches.has(key)?'▾':'▸'}</span></button>`:`<span class="ingredient-name">${label}</span>`}<small class="ingredient-meta ${craft?'ingredient-category':'gather-location'}">${esc(craft?child.category:(child.location||'采集地点未记载'))}</small></div></div><div class="card-stock"><span>库存</span>${stepper(child,key)}</div></div>`;
  }).join('');
  const nested=parts.filter(([id])=>BY_ID[id].ingredients).map(([id])=>{const key=path+'-'+id;return `<div class="recipe-branch${minimized.has(key)?' is-minimized':''}" id="branch-${key}" ${branches.has(key)?'':'hidden'}>${branches.has(key)?recipeBody(BY_ID[id],key):''}</div>`;}).join('');
  const isMin=path!==item.id&&minimized.has(path);
  const head=path===item.id?`<p><b>单件配方</b> · ${time(minutes(item,state.version))}</p>`:`<p class="branch-heading">${iconImg(item)}<span><b>${esc(item.name)}</b> · <b>单件配方</b> · ${time(minutes(item,state.version))}</span><span class="branch-actions"><button class="branch-btn" data-branch-min="${path}" aria-expanded="${!isMin}" aria-label="${isMin?'展开':'缩小'}${esc(item.name)}配方" title="${isMin?'展开':'缩小'}">${isMin?'＋':'−'}</button><button class="branch-btn" data-branch-close="${path}" aria-label="关闭${esc(item.name)}配方" title="关闭">×</button></span></p>`;

const sorts={assembly:{key:null,dir:1},craft:{key:null,dir:1},raw:{key:null,dir:1}};
const collator=new Intl.Collator('ja',{numeric:true});
function sorted(items,group){const {key,dir}=sorts[group];if(!key)return items;const value=x=>key==='need'?result.need[x.id]:key==='stock'?stock(x.id):key==='missing'?result.missing[x.id]:key==='time'?result.missing[x.id]*minutes(x,state.version):x[key]||'';return [...items].sort((a,b)=>{const x=value(a),y=value(b);return dir*(typeof x==='number'?x-y:collator.compare(x,y));});}
function sortHead(label,key,group){const active=sorts[group].key===key,dir=sorts[group].dir;return `<th scope="col" aria-sort="${active?(dir===1?'ascending':'descending'):'none'}">${label}<button class="sort ${active?'active':''}" data-sort="${key}" data-group="${group}" aria-label="按${label}${active&&dir===1?'降序':'升序'}排序">${active&&dir===1?'▲':'▼'}</button></th>`;}
function validState(v){
  if(!v||!Number.isInteger(v.target)||v.target<1||v.target>99||!['original','offline'].includes(v.version)||!v.stock||typeof v.stock!=='object'||Array.isArray(v.stock))throw Error('进度文件格式不正确');
  const stock={};for(const [id,n] of Object.entries(v.stock)){if(!BY_ID[id]||!Number.isInteger(n)||n<0||n>MAX)throw Error('库存数据不正确');stock[id]=n;}
  const crafted={};
  if(v.crafted&&typeof v.crafted==='object'&&!Array.isArray(v.crafted))for(const [id,n] of Object.entries(v.crafted)){if(!BY_ID[id]||!Number.isInteger(n)||n<0)continue;crafted[id]=Math.min(n,stock[id]||0);}
  return {target:v.target,version:v.version,stock,crafted,auto:v.auto!==false};
}
try{const saved=localStorage.getItem(KEY);if(saved)state=validState(JSON.parse(saved));}catch(e){$('save-state').textContent='未能读取保存记录；当前使用零库存';}
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,3500);}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));$('save-state').textContent='已保存';}catch(e){$('save-state').textContent='浏览器无法保存，请导出进度';}}
function snapshot(){history.push(JSON.stringify(state));if(history.length>40)history.shift();$('undo').disabled=false;}
function parseQuantity(value,max=MAX){const s=value.trim();if(!/^\d+(\s*\+\s*\d+)*$/.test(s))return null;const n=s.split('+').reduce((a,b)=>a+Number(b.trim()),0);return Number.isSafeInteger(n)&&n<=max?n:null;}
function time(n){return n>=60?`${Math.floor(n/60)} 小时${n%60?' '+n%60+' 分':''}`:`${n} 分`;}
function minutes(item,version){return version==='offline'?(item.offlineMinutes??item.minutes):item.minutes;}
// Parent-first topological order ensures shared ingredients are aggregated before stock is deducted.
function orderGraph(){const indegree=Object.fromEntries(ALL.map(x=>[x.id,0]));for(const item of DATA.items)for(const id of Object.keys(item.ingredients)){if(!BY_ID[id])throw Error('未知配方材料');indegree[id]++;}const queue=ALL.filter(x=>!indegree[x.id]).map(x=>x.id),order=[];while(queue.length){const id=queue.shift();order.push(id);for(const child of Object.keys(BY_ID[id].ingredients||{}))if(--indegree[child]===0)queue.push(child);}if(order.length!==ALL.length)throw Error('配方存在循环');return order;}
const ORDER=orderGraph();
function calculate(s){const need=Object.fromEntries(ALL.map(x=>[x.id,0])),missing={},used={};need['71']=s.target;for(const id of ORDER){used[id]=Math.min(need[id],s.stock[id]||0);missing[id]=Math.max(0,need[id]-(s.stock[id]||0));for(const [child,count] of Object.entries(BY_ID[id].ingredients||{}))need[child]+=missing[id]*count;}return {need,missing,used,time:DATA.items.reduce((a,x)=>a+missing[x.id]*minutes(x,s.version),0)};}
function stock(id){return state.stock[id]||0;}
function stepper(item,context="table-"+item.id){return `<div class="stepper" data-control="${context}"><button data-step="-1" data-id="${item.id}" aria-label="减少${esc(item.name)}库存" ${stock(item.id)===0?'disabled':''}>−</button><input data-stock="${item.id}" aria-label="${esc(item.name)}库存" inputmode="text" value="${stock(item.id)}"><button data-step="1" data-id="${item.id}" aria-label="增加${esc(item.name)}库存" ${stock(item.id)>=MAX?'disabled':''}>＋</button></div>`;}
function craftRow(item){const n=result.missing[item.id],isOpen=opened.has(item.id);return `<tr class="${item.id==='71'?'total-row':''}" id="item-${item.id}"><td><div class="item-cell">${iconImg(item)}<div class="item-text"><button class="item-name" data-recipe="${item.id}" aria-expanded="${isOpen}" aria-controls="recipe-${item.id}">${esc(item.name)}</button><span class="alias"><span class="category-tag">${esc(item.category)}</span>${esc(item.alias)}</span></div></div></td><td data-label="需求" class="num">${result.need[item.id]}</td><td data-label="库存">${stepper(item)}</td><td data-label="尚缺" class="num ${n?'need':'zero'}">${n||'—'}</td><td data-label="工时" class="num">${n?time(n*minutes(item,state.version)):'—'}</td></tr><tr class="recipe-row" id="recipe-${item.id}" ${isOpen?'':'hidden'}><td colspan="5">${recipeBody(item)}</td></tr>`;}
// One shared column grid for every table, so 需求 / 当前库存 / 尚缺 line up across the whole page.
const COLS='<colgroup><col class="recipe-col"><col class="num-col"><col class="stock-col"><col class="num-col"><col class="time-col"></colgroup>';
function craftTable(items,group='assembly'){items=sorted(items,group);return items.length?`<table>${COLS}<thead><tr>${sortHead("材料名 / 未知名称","name",group)}${sortHead("需求","need",group)}${sortHead("当前库存","stock",group)}${sortHead("尚缺","missing",group)}${sortHead("剩余工时","time",group)}</tr></thead><tbody>${items.map(craftRow).join('')}</tbody></table>`:'<div class="empty">没有符合条件的工作素材。</div>';}
const normalize=s=>s.normalize('NFKC').toLowerCase();
function render(){
  if(!state.crafted||typeof state.crafted!=='object'||Array.isArray(state.crafted))state.crafted={};
  const active=document.activeElement,control=active?.closest('.stepper')?.dataset.control;
  const focusKind=active?.matches('input')?'input':active?.dataset.step;
  const scrolls=[...document.querySelectorAll('.table-wrap')].map(el=>[el.id,el.scrollLeft]);
  result=calculate(state);$('target').value=state.target;$('version').value=state.version;$('auto-consume').checked=autoOn();
  const baseline=calculate({...state,stock:{}}).time,pct=baseline?Math.round((1-result.time/baseline)*100):100;
  $('progress').value=pct;$('progress-text').textContent=pct+'%';$('time').textContent=time(result.time);
  const pending=DATA.items.filter(x=>result.missing[x.id]>0),gather=DATA.raw.filter(x=>result.missing[x.id]>0);
  $('craft-count').textContent=pending.reduce((a,x)=>a+result.missing[x.id],0)+' 件';
  $('raw-count').textContent=gather.reduce((a,x)=>a+result.missing[x.id],0)+' 个';
  $('assembly-list').innerHTML=craftTable(['71','67','68','69','70'].map(id=>BY_ID[id]));
  const q=normalize($('search').value.trim()),category=$('category').value;
  const items=DATA.items.filter(x=>Number(x.id)<67&&(!q||normalize(x.name+' '+x.alias).includes(q))&&(!category||x.category===category)&&(!$('only-missing').checked||result.missing[x.id]>0));
  $('craft-list').innerHTML=craftTable(items,'craft');$('craft-visible').textContent=items.length+' / 62 项';
  const rq=normalize($('raw-search').value.trim());const raw=sorted(DATA.raw.filter(x=>(!$('location').value||x.location===$('location').value)&&(!rq||normalize(x.name+' '+(x.location||'')).includes(rq))&&(!$('raw-missing').checked||result.missing[x.id]>0)),'raw');
  $('raw-visible').textContent=raw.length+' / 29 项';
  $('raw-list').innerHTML=raw.length?`<table>${COLS}<thead><tr>${sortHead("采集素材","name","raw")}${sortHead("需求","need","raw")}${sortHead("当前库存","stock","raw")}${sortHead("尚缺","missing","raw")}${sortHead("采集地点","location","raw")}</tr></thead><tbody>${raw.map(x=>`<tr><td><div class="item-cell">${iconImg(x)}<div class="item-text"><b>${esc(x.name)}</b></div></div></td><td data-label="需求" class="num">${result.need[x.id]}</td><td data-label="库存">${stepper(x)}</td><td data-label="尚缺" class="num ${result.missing[x.id]?'need':'zero'}">${result.missing[x.id]||'—'}</td><td data-label="地点" class="location">${esc(x.location||'原表未记载')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">没有符合条件的采集素材。</div>';
  for(const [id,left] of scrolls)if($(id))$(id).scrollLeft=left;
  if(control&&focusKind){const wrapper=document.querySelector(`[data-control="${control}"]`);const next=wrapper?.querySelector(focusKind==='input'?'input':`[data-step="${focusKind}"]`);next?.focus({preventScroll:true});}
}
const autoOn=()=>state.auto!==false;
// Crafting must consume its ingredients, otherwise a finished item and its parts are counted twice.
// takeOne() spends one unit of a material, falling back to that material's own recipe when the shelf is empty.
// state.crafted[id] counts units currently in stock that were produced here, so only those may be dismantled;
// otherwise pressing +1 with no materials and then -1 would invent ingredients out of nothing.
function takeOne(id,taken,short){
  if(stock(id)>0){state.stock[id]=stock(id)-1;if((state.crafted[id]||0)>0)state.crafted[id]--;taken.set(id,(taken.get(id)||0)+1);return true;}
  const sub=BY_ID[id].ingredients;
  if(!sub){short.n++;return false;}
  let ok=true;
  for(const [child,count] of Object.entries(sub))for(let i=0;i<count;i++)if(!takeOne(child,taken,short))ok=false;
  return ok;
}
function refundIngredients(item,back){
  for(const [child,count] of Object.entries(item.ingredients||{})){
    state.stock[child]=Math.min(MAX,stock(child)+count);
    state.crafted[child]=Math.min(stock(child),(state.crafted[child]||0)+count);
    back.set(child,(back.get(child)||0)+count);
  }
}
function brief(map){const all=[...map].map(([id,n])=>`${BY_ID[id].name}×${n}`);return all.length>4?`${all.slice(0,4).join('、')} 等 ${all.length} 项`:all.join('、');}
// Changing an item's stock is a crafting step: +1 crafts one piece and takes its ingredients out of stock,
// -1 dismantles one piece (only if it was crafted here) and puts the direct ingredients back.
function updateStock(id,n){
  const item=BY_ID[id],delta=n-stock(id);
  if(!delta)return;
  const taken=new Map(),back=new Map(),short={n:0};
  snapshot();
  for(let step=0;step<Math.abs(delta);step++){
    if(delta>0){
      if(stock(id)>=MAX)break;
      state.stock[id]=stock(id)+1;
      if(item.ingredients&&autoOn()){
        let ok=true;
        for(const [child,count] of Object.entries(item.ingredients))for(let i=0;i<count;i++)if(!takeOne(child,taken,short))ok=false;
        if(ok)state.crafted[id]=(state.crafted[id]||0)+1;
      }
    }else{
      if(stock(id)<=0)break;
      state.stock[id]=stock(id)-1;
      if(item.ingredients&&autoOn()&&(state.crafted[id]||0)>0){state.crafted[id]--;refundIngredients(item,back);}
    }
  }
  save();render();
  if(!item.ingredients)return;
  const qty=Math.abs(delta),rest=`；剩余工时 ${time(result.time)}`,gap=short.n?`（${short.n} 份前置材料未入库，未扣除）`:'';
  if(!autoOn())toast(`已记录 ${item.name} ×${qty}${rest}`);
  else if(delta>0)toast(taken.size?`已合成 ${item.name} ×${qty}：扣除 ${brief(taken)}${gap}${rest}`:`已记录 ${item.name} ×${qty}${gap}${rest}`);
  else toast(back.size?`已拆解 ${item.name} ×${qty}：返还 ${brief(back)}${rest}`:`已移除 ${item.name} ×${qty}（无合成记录，未返还材料）${rest}`);
}
function commitInput(input){const id=input.dataset.stock,isTarget=input.id==='target';const n=parseQuantity(input.value,isTarget?99:MAX);if(n===null||(isTarget&&n<1)){input.value=isTarget?state.target:stock(id);input.setAttribute('aria-invalid','true');toast(isTarget?'目标请输入 1～99 的整数':'请输入非负整数或加法，例如 2+3+5');return;}input.removeAttribute('aria-invalid');if(isTarget){if(n!==state.target){snapshot();state.target=n;save();render();}else input.value=n;}else if(n!==stock(id))updateStock(id,n);else input.value=n;}
document.addEventListener('change',e=>{if(e.target.matches('[data-stock],#target'))commitInput(e.target);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-stock],#target')){e.preventDefault();commitInput(e.target);}});
// Commit on Enter/change, not on each key, so addition expressions can be entered intact.
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.sort){const sort=sorts[b.dataset.group];sort.dir=sort.key===b.dataset.sort?-sort.dir:1;sort.key=b.dataset.sort;render();document.querySelector(`[data-group="${b.dataset.group}"][data-sort="${b.dataset.sort}"]`)?.focus({preventScroll:true});}
  else if(b.dataset.step){const id=b.dataset.id;updateStock(id,Math.min(MAX,Math.max(0,stock(id)+Number(b.dataset.step))));}
  else if(b.dataset.target){const n=Math.min(99,Math.max(1,state.target+Number(b.dataset.target)));if(n!==state.target){snapshot();state.target=n;save();render();}}
  else if(b.dataset.recipe){const id=b.dataset.recipe;opened.has(id)?opened.delete(id):opened.add(id);b.setAttribute('aria-expanded',opened.has(id));$('recipe-'+id).hidden=!opened.has(id);}
  else if(b.dataset.branch){const key=b.dataset.branch,root=key.split('-')[0];branches.has(key)?closeBranch(key):branches.add(key);$('recipe-'+root).firstElementChild.innerHTML=recipeBody(BY_ID[root]);document.querySelector(`[data-branch="${key}"]`)?.focus({preventScroll:true});}
  else if(b.dataset.branchMin){const key=b.dataset.branchMin,root=key.split('-')[0];minimized.has(key)?minimized.delete(key):minimized.add(key);$('recipe-'+root).firstElementChild.innerHTML=recipeBody(BY_ID[root]);document.querySelector(`[data-branch-min="${key}"]`)?.focus({preventScroll:true});}
  else if(b.dataset.branchClose){const key=b.dataset.branchClose,root=key.split('-')[0];closeBranch(key);$('recipe-'+root).firstElementChild.innerHTML=recipeBody(BY_ID[root]);document.querySelector(`[data-branch="${key}"]`)?.focus({preventScroll:true});}
});
for(const id of ['search','category','only-missing','raw-search','raw-missing','location'])$(id).addEventListener(id.includes('search')?'input':'change',render);
$('version').addEventListener('change',()=>{snapshot();state.version=$('version').value;save();render();});
$('auto-consume').addEventListener('change',e=>{snapshot();state.auto=e.target.checked;save();render();toast(e.target.checked?'已开启：合成时自动扣除前置材料':'已关闭：库存只按手动填写记录');});
$('location').innerHTML+=[...new Set(DATA.raw.map(x=>x.location).filter(Boolean))].sort(collator.compare).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
$('category').innerHTML+=[...new Set(DATA.items.filter(x=>Number(x.id)<67).map(x=>x.category))].map(c=>`<option>${esc(c)}</option>`).join('');
$('reset').onclick=()=>{if(!confirm('清空全部库存？目标数量与时间口径将保留，可撤销。'))return;snapshot();state.stock={};state.crafted={};save();render();};
$('undo').onclick=()=>{if(!history.length)return;state=JSON.parse(history.pop());$('undo').disabled=!history.length;save();render();toast('已撤销上一步');};
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({format:'ciel-es45-v1',...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ciel-es45-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('进度文件已导出');};
$('import').onclick=()=>$('import-file').click();
$('import-file').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{if(file.size>100000)throw Error('进度文件过大');const parsed=JSON.parse(await file.text());if(parsed.format!=='ciel-es45-v1')throw Error('不是本页导出的进度文件');const next=validState(parsed);if(!confirm('导入将替换当前库存、目标数量和时间口径，是否继续？'))return;snapshot();state=next;save();render();toast('已导入进度');}catch(error){toast(error.message||'无法读取进度文件');}finally{e.target.value='';}};
$('copy-list').onclick=async()=>{const rows=DATA.raw.filter(x=>result.missing[x.id]>0);const text=rows.length?rows.map(x=>`${x.name} × ${result.missing[x.id]}${x.location?' / '+x.location:''}`).join('\n'):'采集素材已备齐';try{await navigator.clipboard.writeText(text);toast('已复制全部尚缺采集素材');}catch(e){const ta=document.createElement('textarea');ta.value=text;document.body.append(ta);ta.select();const ok=document.execCommand('copy');ta.remove();toast(ok?'已复制采集清单':'复制失败，请手动选择表格内容');}};
function syncNav(){const sections=[...document.querySelectorAll('main section')];let current=sections[0];for(const section of sections)if(section.getBoundingClientRect().top<=150)current=section;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.getAttribute('href')===(current.id==='plan'?'#top':'#'+current.id)));}
window.addEventListener('scroll',syncNav,{passive:true});window.addEventListener('resize',syncNav);syncNav();
render();
</script></body></html>
