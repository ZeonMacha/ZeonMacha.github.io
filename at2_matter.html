<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width,initial-scale=1" name="viewport">
    <title>Ar tonelico2 话题自查表</title>
    <link href="at2-matter/style.css" rel="stylesheet">
    <script defer="" src="at2-matter/data.js">
    </script>
    <script defer="" src="at2-matter/app.js">
    </script>
  <style id="guide-name-colors">
      .hero-name.ruka, option[value="ruka"] { color: #bf2424; }
      .hero-name.cloche, option[value="cloche"] { color: #245fc1; }
      .hero-name.jakuri, option[value="jakuri"] { color: #8042a3; }
      main { text-autospace: normal; }
    </style>
  <style>
.at2-pages { margin-top: 16px; }
.at2-pages .source-link { display: block; margin: 0; padding: 3px 0; }
</style>
</head>
  <body>
    <div class="layout">
      <aside class="toc">
        <a class="brand" href="#top"><span>Ar tonelico2<small>话题自查表</small></span></a>
        <div class="nav-label">对话话题</div>
        <nav aria-label="目录" id="nav"></nav>
        <div class="nav-label">记录</div>
        <div class="overall"><strong id="total">0 / 324</strong><span>当前路线完成进度</span><progress id="progress" max="324" value="0"></progress></div>
        <p class="save-state" id="save-state" role="status">自动保存于当前浏览器</p>
        <div class="backup"><button id="export">导出记录</button><button id="import">导入记录</button><input accept="application/json,.json" hidden="" id="import-file" type="file"/></div>
        <nav class="sidebar-links at2-pages" aria-label="相关页面">
  <a class="source-link" href="at2_walkthrough.html" target="_blank" rel="noopener noreferrer">主线攻略</a>
  <a class="source-link" href="at2_dualstall.html" target="_blank" rel="noopener noreferrer">二重安装分析</a>
  <a class="source-link" href="at2_matter.html" target="_blank" rel="noopener noreferrer">话题自查表</a>
  <a class="source-link" href="index.html" target="_blank" rel="noopener noreferrer">返回主页</a>
</nav></aside>
      <main id="top">
        <header>
          <p class="eyebrow" hidden="">AR TONELICO II ・ MATTER CHECKLIST</p>
          <h1>Ar tonelico2 <span class="title-label">话题自查表</span></h1>
          <p class="lead" hidden="">旅途中，还有尚未说出口的话。<br/>逐一记录对话话题与同步话题的收集情况。</p>
          
        </header>
        <section aria-label="筛选" class="filter-panel">
          <div class="filter-title">
            <h2>筛选显示</h2>
            <button class="text-button" id="clear-filters">清除筛选</button>
          </div>
          <div class="filters"><label>魔大陆选择路线<select id="route"><option value="">全部 / 未选择</option><option value="ruka">瑠珈线</option><option value="cloche">克萝洁线</option></select></label> <label>搭档 / 结局<select id="partner"><option value="">全部 / 未选择</option><option value="ruka">瑠珈</option><option value="cloche">克萝洁</option><option value="jakuri">蛇刳</option><option value="cocona">可可娜（三人均不进入 CS-Lv5）</option></select></label> <label>勾选状态<select id="status"><option value="">全部</option><option value="todo">未勾选</option><option value="done">已勾选</option></select></label> <label>话题类型<select id="kind"><option value="">全部</option><option value="talk">对话话题</option><option value="rest">同步话题・休息</option><option value="bath">同步话题・浴池</option></select></label> <label class="search">关键词<input autocomplete="off" id="search" placeholder="搜索标题、地点或条件" type="search"/></label></div>
          <div class="filter-bottom"><label><input id="limited" type="checkbox"/> 仅显示标有期限或消失条件的话题</label><span aria-live="polite" id="results"></span></div>
          <p class="fine" hidden="" id="filter-note">路线与搭档是不同条件。仅隐藏明确标注了对应条件的话题。</p>
        </section>
        <div id="tables"></div>
        <p hidden="" id="empty">没有符合条件的话题，请调整筛选条件。</p>
        <section class="guide" id="guide">
          <button class="text-button danger" id="reset">清空全部勾选</button>
        </section>
        <footer><span>Ar tonelico II ・ 话题自查表</span><a href="#top">返回顶部</a></footer>
      </main>
    </div>
  </body>
</html>
