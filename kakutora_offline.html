*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:56px 40px;isolation:isolate}
body::before{content:"";position:fixed;inset:-24px;z-index:-2;background:var(--art) center 43%/cover no-repeat;filter:blur(10px);opacity:.85}body::after{content:"";position:fixed;inset:0;z-index:-1;background:#e8e8e833}
button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #fff;outline-offset:3px}
html{--glass:rgba(30,30,34,.52)}
.nest{position:relative;isolation:isolate;transform:translateY(-12px);width:min(1020px,100%);height:min(700px,calc(100svh - 112px));min-height:360px;display:grid;grid-template-columns:164px minmax(0,1fr);overflow:hidden;border:1px solid #ffffff30;border-radius:8px;background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);box-shadow:0 24px 70px #0003}

/* Opening: glass HUD, then the window grows from a point to a line, then unfolds. */

// A random local identity, persisted per browser profile and site; no device fingerprinting.
function randomBotDigits(){
 const values=new Uint32Array(5);
 crypto.getRandomValues(values);
 return Array.from(values,value=>String(value%10)).join('');
}
const botId=(()=>{
 const key='kakutora.offline.bot-id.v1';
 try{
  const saved=localStorage.getItem(key);
  if(/^\d{5}$/.test(saved||''))return saved;
  if(/^\d{8}$/.test(saved||'')){
   const shortened=saved.slice(0,5);
   localStorage.setItem(key,shortened);
   return shortened;
  }
  const generated=randomBotDigits();
  localStorage.setItem(key,generated);
  return generated;
 }catch{return randomBotDigits();}
})();
document.querySelector('.sidebar-bottom').textContent='BOT'+botId;

function fillBot(text){
 return String(text||'').replaceAll('{bot}',botId);

CHATS[0].avatar=HOME_AVATAR;
const homeRoom=CHATS[0];
const rooms=CHATS.slice(1);
function currentRoom(){return active===-1?homeRoom:rooms[active];}
let active=-1;
const list=document.querySelector('.contacts'),log=document.querySelector('.messages');
// 使用保存的会话按钮，保留头像、文字位置及所有手动调整，避免重复追加。
Array.from(list.children).forEach((button,i)=>{
 if(!rooms[i])return;
 rooms[i].name=button.querySelector('strong').textContent;
 button.addEventListener('click',()=>{active=i;render();});
});
document.querySelector('.brand').addEventListener('click',()=>{active=-1;render();});
let messageObserver;
let revealOrder=0;
function messageInLog(row){
 const area=log.getBoundingClientRect();
 const box=row.getBoundingClientRect();
 return box.bottom>area.top+4&&box.top<area.bottom-4;
}
function revealRow(row){
 if(row.classList.contains('is-visible'))return;
 row.style.setProperty('--reveal-delay',Math.min(revealOrder++,4)*90+'ms');
 row.classList.add('is-visible');
}
function revealInView(){
 log.querySelectorAll('.message:not(.is-visible)').forEach(row=>{
  if(messageInLog(row))revealRow(row);
 });
}
function revealMessages(){
 messageObserver?.disconnect();
 log.removeEventListener('scroll',revealInView);
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){
  log.classList.remove('reveal-enabled');
  log.querySelectorAll('.message').forEach(row=>row.classList.add('is-visible'));
  return;
 }
 log.classList.add('reveal-enabled');
 if(document.documentElement.classList.contains('intro-active'))return;
 revealOrder=0;
 const rows=[...log.querySelectorAll('.message:not(.is-visible)')];
 if(!rows.length)return;
 const arm=()=>{
  revealInView();
  if('IntersectionObserver' in window){
   messageObserver=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{
     if(!entry.isIntersecting)return;
     revealRow(entry.target);
     messageObserver.unobserve(entry.target);
    });
   },{root:null,threshold:0.01});
   rows.forEach(row=>{if(!row.classList.contains('is-visible'))messageObserver.observe(row);});
  }
  log.addEventListener('scroll',revealInView,{passive:true});
  setTimeout(revealInView,280);
 };
 requestAnimationFrame(()=>requestAnimationFrame(arm));
}
function appendMessage(message){
 const row=document.createElement('div');row.className='message'+(message.mine?' mine':'');
 const room=currentRoom();
 if(!message.mine){
  const avatar=document.createElement('img');avatar.className='message-avatar';avatar.alt='';
  avatar.src=room.avatar||list.children[active].querySelector('img').src;row.append(avatar);
 }
 const label=document.createElement('div');label.className='byline';label.textContent=(message.mine?'YOU':room.speaker)+' WROTE...';row.append(label);
 const bubble=document.createElement('div');bubble.className='bubble';
 if(message.image){
  bubble.classList.add('has-image');
  const picture=document.createElement('img');picture.className='bubble-image';picture.alt=message.alt||'对话图片';picture.src=message.image;
  bubble.append(picture);
  if(message.text){const caption=document.createElement('span');caption.className='image-caption';caption.textContent=fillBot(message.text);bubble.append(caption);}
 }else{bubble.textContent=fillBot(message.text);}
 const file=message.download||message.link;
 if(file){
  const link=document.createElement(file.url?'a':'span');link.className='download-file';link.textContent=file.filename||file.name;
  if(file.url){link.href=file.url;link.target='_blank';link.rel='noopener noreferrer';}
  else{link.classList.add('pending');link.setAttribute('aria-disabled','true');link.title='下载地址待补充';}
  bubble.append(link);
 }
 row.append(bubble);log.append(row);
}
function appendLogout(room){
 if(!room.character)return;
 const row=document.createElement('div');row.className='message system-logout';
 const badge=document.createElement('div');badge.className='wave-badge';const badgeText=document.createElement('span');badgeText.textContent='WAVE SYSTEM MSG';badge.appendChild(badgeText);
 const text=document.createElement('div');text.className='wave-logout-text';text.textContent='【'+room.character+'】已登出';
 const end=document.createElement('button');end.type='button';end.className='wave-end-chat';end.textContent='点击结束聊天';
 end.addEventListener('click',()=>{active=active>=rooms.length-1?-1:active+1;render();});
 row.append(badge,text,end);log.append(row);
}
function render(){
 messageObserver?.disconnect();
 const isHome=active===-1;
 document.querySelector('.brand').setAttribute('aria-pressed',String(isHome));
 log.classList.remove('reveal-enabled');
 log.setAttribute('role','log');
 log.setAttribute('aria-live','polite');
 log.setAttribute('aria-label',isHome?'主页发布说明':'聊天消息');
 const room=currentRoom();
 document.querySelector('#chat-title').textContent=room.name;
 document.querySelector('.chat-subtitle').textContent=room.subtitle;
 Array.from(list.children).forEach((button,i)=>button.setAttribute('aria-pressed',String(i===active)));
 log.replaceChildren();const date=document.createElement('time');date.className='date';date.dateTime=systemDateValue();date.textContent=systemDate();
 date.setAttribute('aria-label','今天');
 log.append(date);
 room.messages.forEach(appendMessage);
 appendLogout(room);
 log.scrollTop=0;
 revealMessages();
}

render();

// Wait for the embedded artwork and initial document, with a bounded loading hold.
(()=>{
 const root=document.documentElement, panel=document.querySelector('.nest');
 const loader=document.querySelector('.intro-loader');
 const veil=document.querySelector('.intro-veil');
 function abortIntro(){
  root.classList.remove('intro-active','intro-ready','intro-opening');
  panel?.removeAttribute('inert');
  loader?.remove();
  veil?.remove();
  clearTimeout(window.introDeadline);
 }
 if(!root.classList.contains('intro-active')||!panel||!loader||matchMedia('(prefers-reduced-motion: reduce)').matches){abortIntro();if(typeof revealMessages==='function'&&panel)revealMessages();return;}
 panel.setAttribute('inert','');
 clearTimeout(window.introDeadline);
 function alignIntro(){
  const box=panel.getBoundingClientRect();
  loader.style.top=(box.top+box.height/2)+'px';
  loader.style.left=(box.left+box.width/2)+'px';
 }
 alignIntro();
 requestAnimationFrame(alignIntro);
 const introResizeObserver=typeof ResizeObserver==='function'?new ResizeObserver(alignIntro):null;
 introResizeObserver?.observe(panel);
 window.addEventListener('load',alignIntro,{once:true});
 window.addEventListener('resize',alignIntro);
 function finishIntro(){
  abortIntro();
  revealMessages();
  introResizeObserver?.disconnect();
  window.removeEventListener('load',alignIntro);
  window.removeEventListener('resize',alignIntro);
 }
 window.introDeadline=setTimeout(finishIntro,16000);
 const loaded=document.readyState==='complete'?Promise.resolve():new Promise(resolve=>window.addEventListener('load',resolve,{once:true}));
 Promise.all([new Promise(resolve=>setTimeout(resolve,1350)),Promise.race([loaded,new Promise(resolve=>setTimeout(resolve,3200))])]).then(()=>{
  if(!root.classList.contains('intro-active'))return;
  const label=document.querySelector('.intro-label');
  if(!label){finishIntro();return;}
  root.classList.add('intro-ready');
  const greeting='HELLO, BOT'+botId+'!';
  const typed=document.createElement('span');typed.className='bot-typewriter';typed.setAttribute('aria-hidden','true');
  const text=document.createTextNode('');typed.append(text);label.replaceChildren(typed);
  const started=performance.now();
  function typeGreeting(now){
   if(!root.classList.contains('intro-active')||!label.isConnected)return;
   const count=Math.min(greeting.length,Math.floor((now-started)/85));
   text.textContent=greeting.slice(0,count);
   if(count<greeting.length)requestAnimationFrame(typeGreeting);
  }
  requestAnimationFrame(typeGreeting);
  loader.setAttribute('aria-label','你好，BOT'+botId);
  const holdAfterHello=900;
  setTimeout(()=>{
   if(!root.classList.contains('intro-active'))return;
   void panel.offsetWidth;
   root.classList.add('intro-opening');
   setTimeout(finishIntro,2500);
  },greeting.length*85+holdAfterHello);
 });
})();
